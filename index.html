<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#f2f2ee;--surface:#ffffff;--surface2:#ecece6;--line:#dcdcd4;--text:#17191b;--muted:#5f6469;
  --accent:#2a7a68;--on-accent:#ffffff;--accent-soft:#dfede8;
  --p:#3a6ad0;--c:#b07a12;--f:#a24f86;--warm:#b4612f;--warm-soft:#f7e9df;--danger:#b23a3a;
  --shadow:0 1px 2px rgba(20,20,10,.04),0 6px 18px rgba(20,20,10,.045);
  --r:18px;--nav-h:62px;--nav-gap:max(var(--sab),12px);--nav-space:calc(var(--nav-h) + var(--nav-gap) + 10px);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --kb:0px;--vvh:100vh;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0f1112;--surface:#191c1e;--surface2:#24282a;--line:#2f3437;--text:#eef0f1;--muted:#a0a7ac;
    --accent:#5bbfa6;--on-accent:#05221b;--accent-soft:#173a32;
    --p:#80a6f4;--c:#e2b552;--f:#dc92c3;--warm:#e6996b;--warm-soft:#3a2619;--danger:#f08080;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0f1112;--surface:#191c1e;--surface2:#24282a;--line:#2f3437;--text:#eef0f1;--muted:#a0a7ac;
  --accent:#5bbfa6;--on-accent:#05221b;--accent-soft:#173a32;
  --p:#80a6f4;--c:#e2b552;--f:#dc92c3;--warm:#e6996b;--warm-soft:#3a2619;--danger:#f08080;
  --shadow:none;color-scheme:dark;
}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.fill{fill:currentColor}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}

#app{max-width:600px;margin:0 auto;min-height:100vh;padding-left:var(--sal);padding-right:var(--sar)}
header.top{position:relative;z-index:2;padding:calc(var(--sat) + 4px) 16px 2px}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
}
.top-row{display:flex;align-items:center;gap:2px;min-height:44px}
.top-row h1{font-size:30px;font-weight:750;letter-spacing:-.025em;flex:1;line-height:1.1}
.iconbtn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--text);border-radius:12px;padding:0}
.iconbtn:active{background:var(--surface2)}
.iconbtn.muted{color:var(--muted)}
main{padding:4px 16px calc(var(--nav-space) + 20px);outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding:14px calc(12px + var(--sar)) var(--nav-gap) calc(12px + var(--sal));
  background:linear-gradient(to bottom,transparent,var(--bg) 55%)}
.tabs .inner{display:flex;gap:8px;align-items:center;max-width:520px;margin:0 auto;pointer-events:auto}
.tabbar{position:relative;flex:1;min-width:0;display:flex;height:var(--nav-h);padding:5px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .tabbar{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px)}
}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:color-mix(in srgb,var(--ic,var(--accent)) 15%,transparent);pointer-events:none}
.tab-ind.ready{transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s cubic-bezier(.3,1.25,.5,1),background-color .3s}
.tab{position:relative;z-index:1;flex:1;min-width:44px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:999px;padding:0;transition:color .2s}
.tab .ic{transition:transform .18s}
.tab:active .ic{transform:scale(.86)}
.tab[aria-current=page]{color:var(--tc,var(--accent))}
.tab[aria-current=page] .ic{stroke-width:2.2}
.tab .dot{position:absolute;top:7px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--train);box-shadow:0 0 0 2px var(--surface);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.navfab{flex:none;width:var(--nav-h);height:var(--nav-h);border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(0,0,0,.24),0 1px 3px rgba(0,0,0,.12);transition:transform .15s}
.navfab:active{transform:scale(.9)}
.navfab .ic{width:28px;height:28px;stroke-width:2.4}
@media (max-width:350px){:root{--nav-h:58px}.tabs .inner{gap:6px}.tab{font-size:9.5px}}

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 8px;min-height:44px}
.card-h h2,.card-h h3{font-size:17px;font-weight:650;line-height:1.25}
.sec-t{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;transition:transform .12s,background .15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{padding:0 12px;font-size:15px}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.btns .btn{flex:1 1 auto}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;
  min-height:44px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none;margin:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input[type=date]{min-height:44px;display:block}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
[aria-invalid=true]{border-color:var(--danger)!important}
.field{display:block;margin:0 0 12px;min-width:0}
.field>.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field>.hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.err-t{color:var(--danger);font-size:14px;margin:4px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inunit{position:relative}
.inunit>input{padding-right:46px}
.inunit>.u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;margin:0 0 12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{min-height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.chip[aria-pressed=true]::before{content:"✓ ";font-weight:700}
.chip.nocheck[aria-pressed=true]::before{content:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:44px;border:0;background:none;padding:4px 0;text-align:left;color:inherit}
.lib>.m{flex:1;min-width:0}
.r{text-align:right;flex:none}
.big{font-size:34px;font-weight:750;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.05}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.macro{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.macro .n{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:0 0 12px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--accent-soft);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:16px 8px;font-size:15px}
.empty .btn{margin-top:12px}
.quickbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.qa{min-height:60px;flex-direction:column;gap:4px;font-size:13px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:0 6px}
.qa.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.sticky-act{position:sticky;bottom:calc(var(--nav-space) + 4px);outline:10px solid var(--bg);z-index:5;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ring{flex:none}
.ring .trk{stroke:var(--surface2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.nut-top{display:flex;align-items:center;gap:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.note p{margin:0 0 8px}
.pill-on{color:var(--accent);font-weight:650}

/* banners */
.banner{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;font-size:14px;border-radius:14px;margin:0 0 6px;min-height:44px}
.banner .grow{font-weight:600}
.banner.demo{background:var(--accent-soft)}
.banner.err{background:var(--warm-soft)}
.banner.wo{background:var(--accent);color:var(--on-accent)}
.banner.wo .btn{background:var(--on-accent);color:var(--accent);border:0}
.banner .btn{min-height:44px}

/* date bar */
.datebar{display:flex;align-items:center;gap:4px;margin-top:2px}
.datepill{position:relative;flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:650;cursor:pointer;overflow:hidden}
.datepill .sub{color:var(--muted);font-weight:500;font-size:14px}
.date-native{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;cursor:pointer;border:0}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:100}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb);margin:0 auto;max-width:600px;max-height:calc(var(--vvh) - var(--sat) - 20px);
  display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);outline:none;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet-wrap.in .backdrop{opacity:1}.sheet-wrap.in .sheet{transform:none}
.sheet-wrap.out .backdrop{opacity:0}.sheet-wrap.out .sheet{transform:translateY(105%)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 20px;flex:none}
.sheet-h h2{flex:1;font-size:19px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 16px;overscroll-behavior:contain;flex:1 1 auto}
.sheet-f{display:flex;gap:10px;padding:12px 20px calc(12px + var(--sab));border-top:1px solid var(--line);flex:none}
.sheet-f .btn{flex:1}
.sheet-f:empty{display:none}
.sheet-b:last-child{padding-bottom:calc(20px + var(--sab))}
.msg{margin:4px 0 14px;line-height:1.5}
.acts{display:flex;flex-direction:column;gap:6px}
.acts .btn{justify-content:flex-start;width:100%}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-space) + 8px + var(--kb));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:300;
  background:var(--text);color:var(--bg);border-radius:14px;padding:4px 4px 4px 16px;display:flex;align-items:center;gap:6px;min-height:48px;max-width:calc(100% - 32px);
  transition:opacity .2s,transform .2s;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast:not(:has(button)){padding-right:16px}
#toast button{min-height:40px;min-width:44px;color:var(--bg);background:transparent;border:0;font-weight:700;padding:0 12px;border-radius:10px}
body.wo-open #toast{bottom:calc(var(--sab) + 84px + var(--kb))}

/* habits */
.habit{display:flex;align-items:center;gap:10px;min-height:62px;padding:6px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit.off .lib{opacity:.62}
.hicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;color:var(--hc);background:color-mix(in srgb,var(--hc) 16%,transparent)}
.hctl{display:flex;align-items:center;gap:6px;flex:none}
.round{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);transition:background .15s,border-color .15s}
.round.on{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent));color:#fff}
.stepb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text);padding:0}
.stepb:active{background:var(--surface2)}
.stepb:disabled{opacity:.35}
.val{min-width:44px;min-height:44px;border:0;background:none;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;padding:0 2px;display:grid;place-items:center}
.val .u{font-size:11px;color:var(--muted);font-weight:600;display:block;line-height:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--c);display:grid;place-items:center;color:#fff}
.sw[aria-pressed=true]{border-color:var(--text)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:0 0 12px}
.emo{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px}
.emo[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px}
.daypick .chip{padding:0;font-size:14px;border-radius:12px}
.daypick .chip[aria-pressed=true]::before{content:none}
.daypick .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.heat{margin:6px 0 4px}
.heat svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 2px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:12px;height:12px}

/* charts */
.chart{margin:6px 0 16px}
.ch-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:650;margin:0 0 6px}
.ch-t .u{color:var(--muted);font-weight:500;font-size:13px}
.ch-svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.ch-svg .grid{stroke:var(--line);stroke-width:1}
.ch-svg .ax{fill:var(--muted);font-size:10px;font-family:inherit}
.ch-svg .tgt{stroke:var(--text);stroke-width:1.5;stroke-dasharray:4 3;opacity:.55}
.ch-svg .hl{fill:var(--surface2)}
.ch-svg .miss{fill:var(--muted);opacity:.6}
.ch-svg .hit{cursor:pointer}
.ch-cap{font-size:13px;color:var(--muted);min-height:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.ch-empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 8px;background:var(--surface2);border-radius:12px}

/* workout overlay */
#wo{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wo-h{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 6px) calc(10px + var(--sar)) 8px calc(10px + var(--sal));background:var(--bg);border-bottom:1px solid var(--line)}
.wo-title{flex:1;text-align:center;min-width:0}
.wo-title .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo-title .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wo-b{max-width:600px;margin:0 auto;padding:12px calc(12px + var(--sar)) calc(120px + var(--sab)) calc(12px + var(--sal))}
.ex-card{padding:14px 12px}
.ex-h{display:flex;align-items:flex-start;gap:6px}
.ex-h h3{font-size:17px;font-weight:700;line-height:1.25;padding-top:10px}
.ex-sub{font-size:13px;color:var(--muted);margin:2px 0 6px}
.sets{width:100%;border-collapse:separate;border-spacing:0 5px;table-layout:fixed}
.sets th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:0 2px}
.sets td{padding:0 3px;text-align:center;vertical-align:middle}
.sets td:first-child{border-radius:12px 0 0 12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sets td:last-child{border-radius:0 12px 12px 0}
.sets tr.done td{background:var(--accent-soft)}
.sets tr.done td:first-child{color:var(--text)}
.cell{text-align:center;padding:8px 2px;font-variant-numeric:tabular-nums;font-weight:600}
.prevbtn{min-height:44px;width:100%;border:0;background:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donebtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0;margin:0 auto}
.donebtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px calc(12px + var(--sar)) calc(8px + var(--sab)) calc(12px + var(--sal));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.restbar .inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.restbar .tm{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;min-width:72px}
.pr-li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.pr-li:last-child{border-bottom:0}
.pr-k{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.tpl-item{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;background:var(--surface)}

/* onboarding */
#ob{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto}
.ob-in{max-width:520px;margin:0 auto;padding:calc(var(--sat) + 32px) 24px calc(var(--sab) + 24px);min-height:100%;display:flex;flex-direction:column}
.ob-in h2{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:0 0 8px}
.ob-in .lead{color:var(--muted);margin:0 0 24px;font-size:17px;line-height:1.5}
.ob-steps{display:flex;gap:6px;margin:0 0 28px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.ob-f{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:8px}
.logo{width:72px;height:72px;margin:0 0 20px;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(34,29,79,.35)}
.logo svg{display:block;width:100%;height:100%}
.logo .ic{width:34px;height:34px;stroke-width:2.2}


/* ===================== DOMAIN COLOURS ===================== */
:root{--train:#2a7a68;--train-soft:#dfede8;--on-train:#fff;--food:#b8502c;--food-soft:#f8e7df;--on-food:#fff;
  --run:#5a4bc4;--run-soft:#e9e6f8;--on-run:#fff;--habit:#2f68b8;--habit-soft:#e1eaf7;--on-habit:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--train:#4fae96;--train-soft:#16352e;--on-train:#04201a;--food:#ec8a6c;--food-soft:#3b231a;--on-food:#2b0d03;
  --run:#a497f5;--run-soft:#27224a;--on-run:#140f33;--habit:#86acf0;--habit-soft:#1c2a44;--on-habit:#0a1830;--accent:#4fae96;--accent-soft:#16352e;--on-accent:#04201a}}
:root[data-theme=dark]{--train:#4fae96;--train-soft:#16352e;--on-train:#04201a;--food:#ec8a6c;--food-soft:#3b231a;--on-food:#2b0d03;
  --run:#a497f5;--run-soft:#27224a;--on-run:#140f33;--habit:#86acf0;--habit-soft:#1c2a44;--on-habit:#0a1830;--accent:#4fae96;--accent-soft:#16352e;--on-accent:#04201a}
body[data-area=train],#wo,.a-train{--accent:var(--train);--accent-soft:var(--train-soft);--on-accent:var(--on-train)}
body[data-area=food],.a-food{--accent:var(--food);--accent-soft:var(--food-soft);--on-accent:var(--on-food)}
body[data-area=run],.a-run{--accent:var(--run);--accent-soft:var(--run-soft);--on-accent:var(--on-run)}

#title{font-size:32px;font-weight:760;letter-spacing:-.03em;line-height:1.12;margin:-2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cbar{position:fixed;top:0;left:0;right:0;z-index:25;height:calc(var(--sat) + 46px);padding:var(--sat) 56px 0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--line);font-weight:650;font-size:16px;
  opacity:0;transform:translateY(-100%);transition:opacity .2s,transform .22s;pointer-events:none}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){#cbar{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.7) blur(18px);-webkit-backdrop-filter:saturate(1.7) blur(18px)}}
#cbar.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
#ctitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn.cal{position:relative;overflow:hidden}
.banner.demo{min-height:44px;padding-left:14px}

.wk{position:relative;margin:0 -10px 6px}

.wk-d{position:relative;min-height:66px;min-width:0;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0}
.wk-d::before{content:"";position:absolute;inset:3px 3px;border-radius:16px;background:transparent;transition:background .2s,transform .2s}
.wk-d>*{position:relative}
.wk-d:active::before{background:var(--surface2)}
.wk-w{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase}
.wk-n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.wk-d.today .wk-n{color:var(--accent)}
.wk-d.today .wk-w{color:var(--accent)}
.wk-d.fut{opacity:.5}
.wk-d.sel::before{background:var(--accent)}
.wk-d.sel .wk-w,.wk-d.sel .wk-n{color:var(--on-accent)}
.wk-dots{display:flex;gap:3px;height:5px}
.wk-dots i{width:5px;height:5px;border-radius:50%;background:var(--dc);opacity:0}
.wk-dots i.on{opacity:1}
.wk-d.sel .wk-dots i.on{background:var(--on-accent)}
.wk.slide-l .wk-days{animation:wkL .3s cubic-bezier(.2,.8,.2,1)}
.wk.slide-r .wk-days{animation:wkR .3s cubic-bezier(.2,.8,.2,1)}

@keyframes wkR{from{transform:translateX(-36px);opacity:.2}}
.vh-focus{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0;border:0}

.vh-focus:last-child:focus{left:auto;right:12px}

#mini{pointer-events:auto;max-width:520px;margin:0 auto 8px}

.mini-ic{position:relative;flex:none;width:40px;height:40px;border-radius:13px;background:var(--train);color:var(--on-train);display:grid;place-items:center}
.mini-ic::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--train);border:2px solid var(--surface);animation:pulse 2s ease-in-out infinite}
.mini-m{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.mini-t{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-go{flex:none;display:flex;align-items:center;gap:2px;font-weight:650;font-size:14px;color:var(--train)}
@keyframes miniIn{from{transform:translateY(14px);opacity:0}}

.dial{position:fixed;inset:0;z-index:60}

@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.dial-back{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}}
.dial.in .dial-back{opacity:1}
.dial-list{position:absolute;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dial-note{font-size:12px;font-weight:650;color:var(--muted);padding:0 4px;opacity:0;transition:opacity .2s}
.dial.in .dial-note{opacity:1}

.dial-ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--dc);color:var(--surface);box-shadow:0 4px 12px color-mix(in srgb,var(--dc) 35%,transparent)}
.dial-item:active .dial-ic{transform:scale(.92)}

.dial-x{position:fixed;margin:0}
.dial-x .ic{transition:transform .28s cubic-bezier(.3,1.35,.5,1)}

.hb-c{position:relative;width:56px;height:56px;display:grid;place-items:center}

  background:color-mix(in srgb,var(--hc) 14%,transparent);transition:background .2s,color .2s,transform .15s}

  font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--hc)}
.hb:active .hb-e{transform:scale(.9)}

.hb-s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px;line-height:1.2}

.pop{animation:pop .36s cubic-bezier(.3,1.6,.5,1)}

const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
const dow = k => fromKey(k).getDay();
const weekStart = k => { const d = fromKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toKey(d); };
const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
const isValidKey = k => typeof k === 'string' && DATE_RE.test(k) && toKey(fromKey(k)) === k;
function fmtDate(k, opts){
  const d = fromKey(k);
  const o = opts || { weekday:'short', day:'numeric', month:'short' };
  if (!opts && d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
const shortD = k => fromKey(k).toLocaleDateString(undefined, { day:'numeric', month:'short' });
function relDay(k){
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, -1)) return 'Yesterday';
  if (k === addDays(t, 1)) return 'Tomorrow';
  return fmtDate(k);
}
function timeOfDayOnDate(dateKey, ts){
  const src = new Date(ts), d = fromKey(dateKey);
  d.setHours(src.getHours(), src.getMinutes(), src.getSeconds(), src.getMilliseconds());
  return d.getTime();
}

/* ---------- Numbers & units (canonical: kg, metres, seconds) ---------- */
function parseNum(v){
  if (v == null) return NaN;
  const s = String(v).trim().replace(',', '.');
  if (s === '' || !/^-?\d*\.?\d*$/.test(s) || s === '.' || s === '-') return NaN;
  return Number(s);
}
function fmtNum(v, dp=1){
  if (v == null || !isFinite(v)) return '—';
  const f = 10 ** dp;
  const r = Math.round(v * f) / f;
  return (Object.is(r, -0) ? 0 : r).toLocaleString(undefined, { maximumFractionDigits: dp });
}
const inputVal = (v, dp=2) => v == null || !isFinite(v) ? '' : String(Math.round(v * 10 ** dp) / 10 ** dp);
const wU = () => S.settings.wUnit, dU = () => S.settings.dUnit;
const wToD = kg => kg == null ? null : (wU() === 'lb' ? kg / KG_PER_LB : kg);
const wFromD = v => wU() === 'lb' ? v * KG_PER_LB : v;
const fmtW = kg => kg == null || kg === 0 ? 'BW' : fmtNum(wToD(kg), 2);
const fmtWU = kg => kg == null || kg === 0 ? 'Bodyweight' : `${fmtW(kg)} ${wU()}`;
const dToD = m => m / (dU() === 'mi' ? M_PER_MI : 1000);
const dFromD = v => v * (dU() === 'mi' ? M_PER_MI : 1000);
const fmtD = m => fmtNum(dToD(m), 2);
const paceSec = r => r.durS / dToD(r.distM);
function fmtDur(s){
  s = Math.max(0, Math.round(s));
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${pad(mm)}:${pad(ss)}` : `${mm}:${pad(ss)}`;
}
function fmtMins(ms){
  const m = Math.round(ms / 60000);
  return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`;
}
function fmtPace(sec){ if (!isFinite(sec) || sec <= 0) return '—'; const s = Math.round(sec); return `${Math.floor(s/60)}:${pad(s%60)}`; }
const paceU = () => `min/${dU()}`;
function niceStep(x){
  if (!(x > 0)) return 1;
  const p = 10 ** Math.floor(Math.log10(x)), m = x / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function fmtAx(v){
  const a = Math.abs(v);
  if (a >= 10000) return fmtNum(v / 1000, 0) + 'k';
  if (a >= 1000) return fmtNum(v / 1000, 1) + 'k';
  return fmtNum(v, a < 10 ? 1 : 0);
}

/* =====================================================================
   3. STORAGE (IndexedDB, one record per collection, atomic writes)
   ===================================================================== */
const Store = {
  db:null,
  open(name){
    return new Promise((res, rej) => {
      if (!('indexedDB' in window) || !window.indexedDB) return rej(new Error('IndexedDB is not available'));
      let req;
      try { req = indexedDB.open(name, 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
      req.onsuccess = () => { this.db = req.result; this.db.onversionchange = () => { this.db.close(); this.db = null; }; res(); };
      req.onerror = () => rej(req.error || new Error('Could not open database'));
      req.onblocked = () => rej(new Error('Database is blocked by another tab'));
    });
  },
  readAll(){
    return new Promise((res, rej) => {
      const out = {};
      const tx = this.db.transaction('kv', 'readonly');
      const rq = tx.objectStore('kv').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
    });
  },
  write(obj, replace){
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('Storage is not available'));
      let tx;
      try {
        tx = this.db.transaction('kv', 'readwrite');
        const st = tx.objectStore('kv');
        if (replace) st.clear();
        for (const k in obj) st.put(obj[k], k);
      } catch (e) { return rej(e); }
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error('Write failed'));
      tx.onabort = () => rej(tx.error || new Error('Write aborted (storage may be full)'));
    });
  },
  close(){ if (this.db){ this.db.close(); this.db = null; } }
};
const dirty = new Set();
let saveTimer = null, storageErr = null, saving = Promise.resolve();
function markDirty(...keys){
  keys.forEach(k => dirty.add(k));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 180);
}
function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!dirty.size || !Store.db) return saving;
  const keys = [...dirty]; dirty.clear();
  const obj = {}; for (const k of keys) obj[k] = S[k];
  saving = Store.write(obj).then(() => {
    if (storageErr){ storageErr = null; renderBanners(); }
  }).catch(e => {
    keys.forEach(k => dirty.add(k));
    storageErr = 'Your last change could not be saved (' + (e && e.message || e) + ').';
    renderBanners();
  });
  return saving;
}
function commit(...keys){ markDirty(...keys); render(); }

/* ---- targets (history keeps past days' meaning) ---- */
function targetFor(date){
  let t = null;
  for (const e of S.settings.targetHistory || []) if (e.from <= date && (!t || e.from >= t.from)) t = e;
  if (t && t.kcal == null && t.p == null && t.c == null && t.f == null) return null;
  return t;
}
function setTargets(vals){
  const th = S.settings.targetHistory;
  const from = th.length ? todayKey() : EARLIEST;
  const entry = { from, kcal:vals.kcal, p:vals.p, c:vals.c, f:vals.f };
  const i = th.findIndex(e => e.from === from);
  if (i >= 0) th[i] = entry; else th.push(entry);
  th.sort((a, b) => a.from < b.from ? -1 : 1);
}

/* ---- nutrition ---- */
function entryVals(e){
  const k = e.amt / e.snap.refAmt;
  return { kcal:e.snap.kcal * k, p:e.snap.p * k, c:e.snap.c * k, f:e.snap.f * k };
}
function sumVals(list){
  const t = { kcal:0, p:0, c:0, f:0 };
  for (const e of list){ const v = entryVals(e); t.kcal += v.kcal; t.p += v.p; t.c += v.c; t.f += v.f; }
  return t;
}
const dayEntries = date => S.diary.filter(e => e.date === date);
function diaryIndex(){
  const m = new Map();
  for (const e of S.diary){ if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); }
  return m;
}
/* A day is "logged" only if it has entries or was explicitly marked complete. Missing days are never zero. */
function isLogged(date, idx){ return !!S.dayDone[date] || (idx ? idx.has(date) : S.diary.some(e => e.date === date)); }
function nutritionRange(from, to, mode){
  const idx = diaryIndex();
  const days = [];
  for (let d = from; d <= to; d = addDays(d, 1)){
    const ents = idx.get(d) || [];
    const logged = isLogged(d, idx);
    days.push({ date:d, logged, complete:!!S.dayDone[d], tot: logged ? sumVals(ents) : null, target:targetFor(d) });
  }
  const pool = days.filter(x => mode === 'complete' ? x.complete : x.logged);
  const avg = { kcal:null, p:null, c:null, f:null };
  if (pool.length) for (const k of ['kcal','p','c','f']) avg[k] = pool.reduce((a, x) => a + x.tot[k], 0) / pool.length;
  return { days, avg, logged:days.filter(x => x.logged).length, complete:days.filter(x => x.complete).length, used:pool.length };
}
function unitWord(unit, amt, label){
  if (unit === 'serving') return (amt === 1 ? 'serving' : 'servings') + (label ? ` (${label})` : '');
  return unit;
}
const fmtAmt = (amt, unit, label) => `${fmtNum(amt, 2)} ${unitWord(unit, amt, label)}`;
const fmtRef = f => `per ${fmtNum(f.refAmt, 2)} ${unitWord(f.refUnit, f.refAmt, f.servingLabel)}`;

/* ---- strength ---- */
const exById = id => S.exercises.find(e => e.id === id);
const exName = (id, fallback) => (exById(id) || {}).name || fallback || 'Exercise';
const activeSession = () => S.sessions.find(s => s.status === 'active');
const doneSessions = () => S.sessions.filter(s => s.status === 'done').sort((a, b) => a.startTs - b.startTs);
const validSets = ex => ex.sets.filter(st => st.done && st.r > 0);
const wKey = w => (w == null || w === 0) ? 'bw' : String(Math.round(w * 1000) / 1000);
function prevPerf(exId, beforeTs, exclId){
  let best = null;
  for (const s of S.sessions){
    if (s.status !== 'done' || s.id === exclId || s.startTs >= beforeTs) continue;
    const ex = s.exercises.find(x => x.exId === exId && validSets(x).length);
    if (ex && (!best || s.startTs > best.s.startTs)) best = { s, ex };
  }
  return best;
}
function sessStats(s){
  let sets = 0, vol = 0, exs = 0;
  for (const ex of s.exercises){
    const v = validSets(ex);
    if (v.length) exs++;
    sets += v.length;
    for (const st of v) if (st.w > 0) vol += st.w * st.r;
  }
  return { sets, vol, exs, dur:(s.endTs || Date.now()) - s.startTs };
}
function exHistory(exId){
  const out = [];
  for (const s of doneSessions()){
    const sets = [];
    for (const ex of s.exercises) if (ex.exId === exId) sets.push(...validSets(ex));
    if (!sets.length) continue;
    let maxW = null, vol = 0, best = 0, tot = 0;
    const byW = new Map();
    for (const st of sets){
      if (st.w > 0 && (maxW == null || st.w > maxW)) maxW = st.w;
      if (st.w > 0) vol += st.w * st.r;
      tot += st.r; best = Math.max(best, st.r);
      const k = wKey(st.w);
      byW.set(k, Math.max(byW.get(k) || 0, st.r));
    }
    out.push({ s, date:s.date, sets, maxW, vol, best, tot, byW });
  }
  return out;
}
function sessionPRs(s){
  const prs = [], seen = new Set();
  for (const ex of s.exercises){
    if (seen.has(ex.exId)) continue;
    seen.add(ex.exId);
    const cur = [];
    for (const e2 of s.exercises) if (e2.exId === ex.exId) cur.push(...validSets(e2));
    if (!cur.length) continue;
    const prior = [];
    for (const p of S.sessions){
      if (p.status !== 'done' || p.id === s.id || p.startTs >= s.startTs) continue;
      for (const e2 of p.exercises) if (e2.exId === ex.exId) prior.push(...validSets(e2));
    }
    if (!prior.length) continue;
    const name = exName(ex.exId, ex.name);
    const curMax = Math.max(...cur.map(x => x.w || 0)), priorMax = Math.max(...prior.map(x => x.w || 0));
    if (curMax > 0 && curMax > priorMax + 1e-9){
      const r = Math.max(...cur.filter(x => (x.w || 0) === curMax).map(x => x.r));
      prs.push({ exId:ex.exId, name, kind:'Heavier weight', text:`${fmtWU(curMax)} × ${r}` });
    }
    const priorBy = new Map();
    for (const x of prior){ const k = wKey(x.w); priorBy.set(k, Math.max(priorBy.get(k) || 0, x.r)); }
    const curBy = new Map();
    for (const x of cur){ const k = wKey(x.w); if (!curBy.has(k) || x.r > curBy.get(k).r) curBy.set(k, x); }
    for (const [k, x] of curBy){
      if (priorBy.has(k) && x.r > priorBy.get(k))
        prs.push({ exId:ex.exId, name, kind:'More reps', text:`${fmtWU(x.w)} × ${x.r} (previous best ${priorBy.get(k)})` });
    }
  }
  return prs;
}

/* ---- runs ---- */
const runsSorted = () => [...S.runs].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0));
function runBuckets(){
  const edges = dU() === 'mi' ? [0, 2, 4, 7, 11, Infinity] : [0, 3, 7, 12, 18, Infinity];
  const u = dU(), out = [];
  for (let i = 0; i < edges.length - 1; i++){
    const a = edges[i], b = edges[i+1];
    out.push({ id:String(i), lo:a, hi:b, label: a === 0 ? `< ${b} ${u}` : b === Infinity ? `${a}+ ${u}` : `${a}–${b} ${u}` });
  }
  return out;
}
const bucketOf = r => { const d = dToD(r.distM); return runBuckets().find(b => d >= b.lo && d < b.hi); };

/* ---- habits ---- */
function schedFor(hb, date){
  let s = hb.sched[0];
  for (const e of hb.sched) if (e.from <= date) s = e;
  return s;
}
function isSched(hb, date){ if (hb.kind === 'reduce') return true; const s = schedFor(hb, date); return !s.days || s.days.includes(dow(date)); }
const hLog = (hb, date) => (S.habitLogs[hb.id] || {})[date];
function hStatus(hb, date, today = todayKey()){
  if (date > today) return 'future';
  const l = hLog(hb, date);
  if (date < hb.start && !l) return 'before';
  const s = schedFor(hb, date);
  if (hb.kind === 'reduce'){
    if (!l) return 'unknown';
    if (l.v === 0) return 'zero';
    if (s.max != null && l.v > s.max) return 'over';
    return 'logged';
  }
  const sch = isSched(hb, date);
  const tgt = hb.type === 'check' ? 1 : (s.target || 1);
  const v = l ? l.v : 0;
  if (v >= tgt) return sch ? 'done' : 'extra';
  if (!sch) return 'off';
  if (v > 0) return date === today ? 'pending' : 'partial';
  return date === today ? 'pending' : 'missed';
}
/* Streak: consecutive scheduled days completed. Unscheduled days and today-in-progress never break it. */
function buildStreaks(hb){
  const today = todayKey();
  let best = 0, run = 0;
  for (let d = hb.start; d <= today; d = addDays(d, 1)){
    const st = hStatus(hb, d, today);
    if (st === 'done'){ run++; if (run > best) best = run; }
    else if (st === 'missed' || st === 'partial') run = 0;
  }
  return { cur:run, best };
}
/* Completion rate counts elapsed scheduled days only; today counts only once completed; future days never count. */
function buildRate(hb, from, to){
  const today = todayKey();
  let den = 0, num = 0;
  for (let d = from > hb.start ? from : hb.start; d <= to && d <= today; d = addDays(d, 1)){
    const st = hStatus(hb, d, today);
    if (st === 'done'){ den++; num++; }
    else if (st === 'missed' || st === 'partial') den++;
  }
  return { num, den };
}
function reduceStats(hb, from, to){
  const today = todayKey();
  const r = { checked:0, zero:0, occ:0, within:0, unknown:0, days:0 };
  for (let d = from > hb.start ? from : hb.start; d <= to && d <= today; d = addDays(d, 1)){
    r.days++;
    const st = hStatus(hb, d, today), l = hLog(hb, d);
    if (st === 'unknown'){ r.unknown++; continue; }
    r.checked++; r.occ += l.v;
    if (st === 'zero') r.zero++;
    if (st !== 'over') r.within++;
  }
  return r;
}
function setLog(hb, date, v, note){
  const m = S.habitLogs[hb.id] || (S.habitLogs[hb.id] = {});
  const prev = m[date];
  if (v == null){ delete m[date]; }
  else m[date] = { v:Math.max(0, Math.round(v * 100) / 100), note: note !== undefined ? note : (prev && prev.note) || '' };
  if (v != null && date < hb.start){ hb.start = date; markDirty('habits'); }
  commit('habitLogs');
}

const sheets = [];
function updateInert(){

  $('#app').inert = anySheet || ob || wo || !!DIAL;

function focusables(root){
  return [...root.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function trapTab(e, root){
  const f = focusables(root); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function openSheet({ title, build, onClose }){
  const prevFocus = document.activeElement;
  const titleId = uid('t');
  const body = h('div', { class:'sheet-b' });
  const foot = h('div', { class:'sheet-f' });
  const ttl = h('h2', { id:titleId, text:title });
  const closeBtn = h('button', { class:'iconbtn', type:'button', 'aria-label':'Close' }, icon('x'));
  const panel = h('div', { class:'sheet', role:'dialog', 'aria-modal':'true', 'aria-labelledby':titleId, tabindex:'-1' },
    h('div', { class:'grab', 'aria-hidden':'true' }), h('div', { class:'sheet-h' }, ttl, closeBtn), body, foot);
  const back = h('div', { class:'backdrop' });
  const wrap = h('div', { class:'sheet-wrap' }, back, panel);
  let closed = false;
  const api = {
    el:panel, body, foot,
    setTitle:t => { ttl.textContent = t; },
    rebuild(){ const st = body.scrollTop; body.replaceChildren(); foot.replaceChildren(); build(api); body.scrollTop = st; },
    close(){
      if (closed) return; closed = true;
      const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
      wrap.classList.remove('in'); wrap.classList.add('out');
      setTimeout(() => wrap.remove(), reduced() ? 0 : 260);
      updateInert();
      if (onClose) onClose();
      if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus({ preventScroll:true });
    }
  };
  back.addEventListener('click', () => api.close());
  closeBtn.addEventListener('click', () => api.close());
  panel.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.stopPropagation(); api.close(); }
    else if (e.key === 'Tab') trapTab(e, panel);
  });
  build(api);
  $('#sheets').append(wrap);
  sheets.push(api);
  updateInert();
  requestAnimationFrame(() => {
    wrap.classList.add('in');
    const af = panel.querySelector('[data-autofocus]');
    (af || panel).focus({ preventScroll:true });
  });
  return api;
}

function confirmSheet({ title, message, ok='Confirm', danger=false, typeToConfirm }){

function chart(o){
  const { labels, tips, series, kind='bar', unit='', fmt = v => fmtNum(v, 1), target=null, title, summary } = o;
  const zero = o.zero ?? (kind === 'bar');
  const n = labels.length, W = 340, H = o.height || 150, pl = 36, pr = 8, pt = 10, pb = 22;
  const iw = W - pl - pr, ih = H - pt - pb;
  const fig = h('figure', { class:'chart', style:'margin-left:0;margin-right:0' });
  if (title) fig.append(h('figcaption', { class:'ch-t' }, h('span', { text:title }), unit ? h('span', { class:'u', text:unit }) : null));
  const vals = series.flatMap(s => s.values.filter(v => v != null && isFinite(v)));
  if (!vals.length){ fig.append(h('div', { class:'ch-empty', text:o.empty || 'No data in this range yet' })); return fig; }
  const tv = target == null ? [] : (Array.isArray(target) ? target.filter(v => v != null) : [target]);

    const span = hi - lo, padv = span > 0 ? span * 0.25 : Math.max(Math.abs(hi) * 0.1, 1);
    y0 = Math.max(0, lo - padv); y1 = hi + padv;
    const st = niceStep((y1 - y0) / 3);
    y0 = Math.floor(y0 / st) * st; y1 = Math.ceil(y1 / st) * st; if (y1 <= y0) y1 = y0 + st;
  }
  const Y = v => pt + ih - (v - y0) / (y1 - y0) * ih;
  const bw = iw / n, X = i => pl + bw * (i + 0.5);
  const svg = sv('svg', { viewBox:`0 0 ${W} ${H}`, class:'ch-svg', role:'img', 'aria-label': summary || title || 'Chart' });
  const hl = sv('rect', { x:0, y:pt, width:bw, height:ih, rx:4, class:'hl', visibility:'hidden' });
  svg.append(hl);
  const axF = o.axFmt || fmtAx;
  for (let k = 0; k <= 3; k++){
    const v = y0 + (y1 - y0) * k / 3, y = Y(v);
    svg.append(sv('line', { x1:pl, x2:W - pr, y1:y, y2:y, class:'grid' }), sv('text', { x:pl - 5, y:y + 3.5, class:'ax', 'text-anchor':'end', text:axF(v) }));
  }
  const every = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i++){
    const isLast = i === n - 1;
    if (!(i % every === 0 && (isLast || n - 1 - i >= every * 0.6)) && !isLast) continue;
    svg.append(sv('text', { x:X(i), y:H - 6, class:'ax', 'text-anchor': n === 1 ? 'middle' : i === 0 ? 'start' : isLast ? 'end' : 'middle', text:labels[i] }));
  }
  const ns = series.length;
  if (kind === 'bar'){
    const gap = Math.min(6, bw * 0.28), bwi = Math.max(1.5, (bw - gap) / ns);
    series.forEach((s, si) => s.values.forEach((v, i) => {
      if (v == null){
        if (o.markMissing) svg.append(sv('rect', { x:pl + bw * i + bw / 2 - 2, y:Y(y0) - 1.5, width:4, height:1.5, class:'miss' }));
        return;
      }
      const x = pl + bw * i + gap / 2 + bwi * si, y = Y(Math.max(v, y0));
      const ht = Math.max(v > 0 ? 1.5 : 0, Y(y0) - y);

    }));
  } else {
    series.forEach((s, si) => {
      let d = '';
      s.values.forEach((v, i) => { if (v != null) d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      svg.append(sv('path', { d, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round', 'stroke-dasharray': si === 1 ? '5 4' : null }));
      s.values.forEach((v, i) => {
        if (v == null) return;
        svg.append(si === 1
          ? sv('rect', { x:X(i) - 3, y:Y(v) - 3, width:6, height:6, fill:'var(--surface)', stroke:s.color, 'stroke-width':2 })
          : sv('circle', { cx:X(i), cy:Y(v), r:3.2, fill:'var(--surface)', stroke:s.color, 'stroke-width':2 }));
      });

    if (Array.isArray(target)) target.forEach((t, i) => { if (t != null) svg.append(sv('line', { x1:pl + bw * i + 1, x2:pl + bw * (i + 1) - 1, y1:Y(t), y2:Y(t), class:'tgt' })); });

  for (let i = 0; i < n; i++){

  }

    });
    const t = target == null ? null : Array.isArray(target) ? target[i] : target;

  const leg = [];

  if (target != null) leg.push(h('span', {}, legendMark('var(--text)', 'dash'), 'Target'));

}

/* Week strip: seven days with dots for food, training and habits. Swipe for other weeks. */
function weekStrip(){

  const idx = diaryIndex();
  const trained = new Set();

  for (const r of S.runs) if (r.date >= ws && r.date <= days[6]) trained.add(r.date);
  const hab = new Set();
  for (const hb of S.habits){ const m = S.habitLogs[hb.id]; if (!m) continue; for (const d of days){ const l = m[d]; if (l && (l.v > 0 || hb.kind === 'reduce')) hab.add(d); } }
  const row = h('div', { class:'wk-days', role:'group', 'aria-label':`Week of ${fmtDate(ws)}. Swipe for other weeks` });
  for (const d of days){
    const fl = [isLogged(d, idx), trained.has(d), hab.has(d)];
    const words = ['food', 'training', 'habits'].filter((_, i) => fl[i]);
    const isSel = d === sel;
    row.append(h('button', { class:'wk-d' + (isSel ? ' sel' : '') + (d === t ? ' today' : '') + (d > t ? ' fut' : ''), type:'button', 'aria-pressed':String(isSel),

      onclick:() => { if (UI.date !== d){ UI.date = d; render(); } } },
      h('span', { class:'wk-w', text:fromKey(d).toLocaleDateString(undefined, { weekday:'narrow' }) }),
      h('span', { class:'wk-n', text:String(fromKey(d).getDate()) }),
      h('span', { class:'wk-dots', 'aria-hidden':'true' }, ['food','train','habit'].map((k, i) => h('i', { class: fl[i] ? 'on' : '', style:`--dc:var(--${k})` })))));
  }
  let sx = 0, sy = 0, st = 0;
  row.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now(); }, { passive:true });
  row.addEventListener('touchend', e => {
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;

}

function nextUp(){

/* ---------- RUNS ---------- */
function viewRuns(){
  const f = frag();
  const runs = runsSorted(), today = todayKey(), ws = weekStart(today);
  const wk = runs.filter(r => r.date >= ws && r.date <= today);
  const longest = runs.reduce((m, r) => !m || r.distM > m.distM ? r : m, null);
  f.append(h('div', { class:'stats' }, stat(`${fmtNum(dToD(wk.reduce((a, r) => a + r.distM, 0)), 1)} ${dU()}`, 'This week'),
    stat(String(wk.length), 'Runs this week'), stat(longest ? `${fmtD(longest.distM)} ${dU()}` : '—', 'Longest run')));
  f.append(btn('Log run', () => openRunSheet(null, today), 'primary block', 'plus'), h('div', { class:'mb' }));
  if (!runs.length) f.append(card(emptyBox('Log a run with distance and time. Pace is calculated for you.')));
  else f.append(h('h2', { class:'sec-t', text:'Recent runs' }), card(h('div', { class:'list' }, runs.slice().reverse().slice(0, 20).map(runRow))));
  return f;
}
function runRow(r){
  return h('div', { class:'li' }, h('button', { class:'lib', type:'button', onclick:() => openRunSheet(r) },
    h('span', { class:'hicon', style:'--hc:var(--run)', 'aria-hidden':'true' }, icon('run', 'sm')),
    h('span', { class:'m' }, h('div', { class:'t', text:`${fmtD(r.distM)} ${dU()} · ${fmtDur(r.durS)}` }),
      h('div', { class:'s', text:`${relDay(r.date)} · ${fmtPace(paceSec(r))} ${paceU()}${r.effort ? ' · ' + EFFORT[r.effort - 1] : ''}` })),
    icon('chevR', 'sm')));
}
function openRunSheet(run, date){
  const d = run ? clone(run) : { id:uid('r'), date: date || todayKey(), distM:null, durS:null, effort:null, notes:'', ts:Date.now() };
  openSheet({ title: run ? 'Edit run' : 'Log run', build(api){
    const dIn = dateInput(d.date, v => { d.date = v; }, 'Run date');
    const dist = numIn(d.distM ? dToD(d.distM) : null, { dp:3, label:`Distance in ${dU()}`, unit:dU(), placeholder:'0.00' });
    const hh = numIn(d.durS ? Math.floor(d.durS / 3600) : null, { int:true, dp:0, label:'Hours', placeholder:'0' });
    const mm = numIn(d.durS ? Math.floor(d.durS % 3600 / 60) : null, { int:true, dp:0, label:'Minutes', placeholder:'0' });
    const ss = numIn(d.durS ? Math.round(d.durS % 60) : null, { int:true, dp:0, label:'Seconds', placeholder:'0' });
    const paceOut = h('div', { class:'stat', 'aria-live':'polite' }, h('div', { class:'v', text:'—' }), h('div', { class:'l', text:`Average pace (${paceU()})` }));
    const err = h('p', { class:'err-t', role:'alert' });
    function readDur(){ const a = hh.num() || 0, b = mm.num() || 0, c = ss.num() || 0; return a * 3600 + b * 60 + c; }
    function upd(){
      const dm = getIn(dist).num(), du = readDur();
      paceOut.firstChild.textContent = dm > 0 && du > 0 ? fmtPace(du / dm) : '—';
    }
    [getIn(dist), hh, mm, ss].forEach(x => x.addEventListener('input', upd));
    const notes = h('textarea', { maxlength:'300', placeholder:'Optional', 'aria-label':'Notes' }); notes.value = d.notes || '';
    api.body.append(field('Date', dIn), field('Distance', dist),
      h('span', { class:'field' }, h('span', { class:'l', text:'Duration (h : min : s)' }), h('div', { class:'grid3' }, hh, mm, ss)),
      paceOut, h('div', { class:'mt' }),
      h('span', { class:'field' }, h('span', { class:'l', text:'Effort (optional)' }),
        chipGroup(EFFORT.map((e, i) => [String(i + 1), e]), d.effort ? String(d.effort) : null, v => { d.effort = d.effort === Number(v) ? null : Number(v); }, 'Effort', 'nocheck')),
      field('Notes', notes), err);
    upd();
    if (run) api.body.append(btn('Delete run', () => {
      const i = S.runs.findIndex(x => x.id === run.id), orig = S.runs[i];
      S.runs.splice(i, 1); commit('runs'); api.close();
      toast('Run deleted', () => { S.runs.splice(i, 0, orig); commit('runs'); });
    }, 'danger block', 'trash'));
    api.foot.append(btn('Cancel', () => api.close()), btn('Save', () => {
      const dm = getIn(dist).num(), du = readDur();
      if ([getIn(dist), hh, mm, ss].some(x => x.hasAttribute('aria-invalid'))){ err.textContent = 'Check the highlighted values.'; return; }
      if (!(dm > 0)){ err.textContent = 'Distance must be more than 0.'; getIn(dist).focus(); return; }
      if (!(du > 0)){ err.textContent = 'Duration must be more than 0.'; mm.focus(); return; }
      if ((mm.num() || 0) > 59 || (ss.num() || 0) > 59){ err.textContent = 'Minutes and seconds must be under 60.'; return; }
      if (!isValidKey(d.date)){ err.textContent = 'Choose a valid date.'; return; }
      // keep canonical metres untouched if the displayed value was not edited
      const prevDisp = run ? Number(inputVal(dToD(run.distM), 3)) : null;
      d.distM = run && prevDisp === dm ? run.distM : dFromD(dm);
      d.durS = du; d.notes = notes.value.trim();
      const i = S.runs.findIndex(x => x.id === d.id);
      if (i >= 0) S.runs[i] = d; else S.runs.push(d);
      commit('runs'); api.close(); toast(run ? 'Run updated' : `Run logged · ${fmtPace(paceSec(d))} ${paceU()}`);
    }, 'primary'));
  } });
}

async function replaceAllData(next){

/* Strict validation: nothing is applied unless the whole file passes. */
function validateBackup(p){
  const E = [], isO = x => x && typeof x === 'object' && !Array.isArray(x), isA = Array.isArray;
  const num = (x, min = 0) => typeof x === 'number' && isFinite(x) && x >= min, numOrNull = (x, min = 0) => x == null || num(x, min);
  const str = x => typeof x === 'string';
  const err = m => { if (E.length < 12) E.push(m); };
  if (!isO(p)) return [`The file is not a ${APP_NAME} backup (not a JSON object).`];
  if (p.app !== APP_ID) err(`This file was not created by ${APP_NAME}.`);
  if (!Number.isInteger(p.schema) || p.schema < 1) err('Missing or invalid schema version.');
  else if (p.schema > SCHEMA) err(`Backup uses a newer schema (v${p.schema}) than this app supports (v${SCHEMA}).`);
  const d = p.data;
  if (!isO(d)) return [...E, 'Backup has no data section.'];
  for (const k of ['exercises','collections','sessions','runs','foods','diary','habits']) if (!isA(d[k])) err(`“${k}” must be a list.`);
  for (const k of ['settings','dayDone','habitLogs']) if (!isO(d[k])) err(`“${k}” must be an object.`);
  if (E.length) return E;
  const s = d.settings;
  if (!['kg','lb'].includes(s.wUnit) || !['km','mi'].includes(s.dUnit)) err('Settings: invalid units.');
  if (!isA(s.targetHistory) || s.targetHistory.some(t => !isO(t) || !str(t.from) || !['kcal','p','c','f'].every(k => numOrNull(t[k])))) err('Settings: invalid targets.');
  const ids = new Set(), uniq = (x, where) => { if (!str(x.id) || !x.id) err(`${where}: missing id.`); else if (ids.has(x.id)) err(`${where}: duplicate id ${x.id}.`); else ids.add(x.id); };
  d.exercises.forEach((e, i) => { uniq(e, `Exercise ${i + 1}`); if (!str(e.name) || !['weighted','bodyweight'].includes(e.kind)) err(`Exercise ${i + 1}: invalid.`); });
  const exIds = new Set(d.exercises.map(e => e.id));
  d.collections.forEach((c, i) => {
    uniq(c, `Collection ${i + 1}`);
    if (!str(c.name) || !isA(c.templates)) return err(`Collection ${i + 1}: invalid.`);
    c.templates.forEach((t, j) => {
      uniq(t, `Template ${j + 1}`);
      if (!str(t.name) || !isA(t.items)) return err(`Template “${t.name}”: invalid.`);
      t.items.forEach(it => { if (!exIds.has(it.exId) || !Number.isInteger(it.sets) || it.sets < 1 || !numOrNull(it.weight) || !numOrNull(it.rest) || !numOrNull(it.repMin) || !numOrNull(it.repMax)) err(`Template “${t.name}”: invalid exercise entry.`); });
    });
  });
  let active = 0;
  d.sessions.forEach((x, i) => {
    uniq(x, `Workout ${i + 1}`);
    if (!['active','done'].includes(x.status) || !isValidKey(x.date) || !num(x.startTs) || (x.status === 'done' && !num(x.endTs)) || !isA(x.exercises)) return err(`Workout ${i + 1}: invalid.`);
    if (x.status === 'active') active++;
    x.exercises.forEach(e => { if (!str(e.exId) || !isA(e.sets) || e.sets.some(st => !isO(st) || !numOrNull(st.w) || !numOrNull(st.r) || typeof st.done !== 'boolean')) err(`Workout ${x.date}: invalid set data.`); });
  });
  if (active > 1) err('More than one workout is marked in progress.');
  d.runs.forEach((r, i) => { uniq(r, `Run ${i + 1}`); if (!isValidKey(r.date) || !(r.distM > 0) || !(r.durS > 0) || !(r.effort == null || [1,2,3,4,5].includes(r.effort))) err(`Run ${i + 1}: invalid.`); });
  d.foods.forEach((f, i) => { uniq(f, `Food ${i + 1}`); if (!str(f.name) || !(f.refAmt > 0) || !['g','ml','serving'].includes(f.refUnit) || !['kcal','p','c','f'].every(k => num(f[k]))) err(`Food “${f.name || i + 1}”: invalid.`); });
  d.diary.forEach((e, i) => {
    uniq(e, `Diary entry ${i + 1}`);
    if (!isValidKey(e.date) || !MEAL_IDS.includes(e.meal) || !str(e.name) || !(e.amt > 0) || !['g','ml','serving'].includes(e.unit) || !isO(e.snap) || !(e.snap.refAmt > 0) || !['kcal','p','c','f'].every(k => num(e.snap[k])))
      err(`Diary entry ${i + 1} (${e.date}): invalid.`);
  });
  for (const k in d.dayDone) if (!isValidKey(k) || d.dayDone[k] !== true) { err('Diary completion data is invalid.'); break; }
  d.habits.forEach((hb, i) => {
    uniq(hb, `Habit ${i + 1}`);
    if (!str(hb.name) || !['build','reduce'].includes(hb.kind) || !['check','count','duration'].includes(hb.type) || !isValidKey(hb.start) || !isA(hb.sched) || !hb.sched.length
      || hb.sched.some(sc => !str(sc.from) || !(sc.days == null || (isA(sc.days) && sc.days.length && sc.days.every(x => Number.isInteger(x) && x >= 0 && x <= 6))) || !numOrNull(sc.target) || !numOrNull(sc.max)))
      err(`Habit “${hb.name || i + 1}”: invalid.`);
  });
  const hIds = new Set(d.habits.map(x => x.id));
  for (const hid in d.habitLogs){
    if (!hIds.has(hid)){ err('Habit logs refer to an unknown habit.'); break; }
    const m = d.habitLogs[hid];
    if (!isO(m) || Object.entries(m).some(([k, l]) => !isValidKey(k) || !isO(l) || !num(l.v))){ err('Habit logs are invalid.'); break; }
  }
  return E;
}
function handleImportFile(file){
  if (!file) return;
  if (file.size > 50 * 1024 * 1024){ toast('That file is too large to be a backup'); return; }
  const rd = new FileReader();
  rd.onerror = () => toast('Could not read the file');
  rd.onload = () => {
    let p; try { p = JSON.parse(rd.result); } catch (e) { return showImportErrors(['The file is not valid JSON.']); }
    const errs = validateBackup(p);
    if (errs.length) return showImportErrors(errs);
    const d = p.data;
    openSheet({ title:'Replace with backup?', build(api){
      api.body.append(h('p', { class:'msg', text:`Backup from ${p.exportedAt ? new Date(p.exportedAt).toLocaleString() : 'an unknown date'} contains:` }),
        ...[['Workouts', d.sessions.length], ['Runs', d.runs.length], ['Foods', d.foods.length], ['Diary entries', d.diary.length], ['Habits', d.habits.length], ['Templates', d.collections.reduce((a, c) => a + c.templates.length, 0)]]
          .map(([l, n]) => h('div', { class:'kv' }, h('span', { class:'muted', text:l }), h('span', { class:'tnum', text:String(n) }))),
        h('p', { class:'msg mt', text:'Replace removes all current data in this browser and puts the backup in its place. Nothing is merged.' }),
        btn('Export current data first', exportData, 'block', 'dl'));
      api.foot.append(btn('Cancel', () => api.close()), btn('Replace', async () => {
        if (!await confirmSheet({ title:'Replace all data?', message:'Your current data will be replaced by the backup. This cannot be undone.', ok:'Replace', danger:true })) return;
        const next = normalize(clone(d));
        try { await replaceAllData(next); } catch (e) { toast('Import failed, nothing changed: ' + e.message); return; }
        api.close(); toast('Backup restored');
        const a = activeSession(); if (a) openWorkout(a.id, 'active');
      }, 'danger'));
    } });
  };
  rd.readAsText(file);
}
function showImportErrors(errs){
  openSheet({ title:'Backup not imported', build(api){
    api.body.append(h('p', { class:'msg', text:'Nothing was changed. The file had these problems:' }), h('ul', { class:'small' }, errs.map(e => h('li', { text:e }))));
    api.foot.append(btn('OK', () => api.close(), 'primary'));
  } });
}

    const next = () => { st.step++; if (st.step > steps) finish(); else draw(); };
    const foot = (onNext, label='Next') => h('div', { class:'ob-f' }, btn(label, onNext, 'primary block'), btn('Skip', next, 'ghost block'));

   13. DEMO DATA (separate database, clearly labelled)

function demoData(){
  const D = blankState();
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  D.settings.onboarded = true;
  D.settings.targetHistory = [{ from:EARLIEST, kcal:2300, p:140, c:260, f:75 }];
  const ex = (name, kind='weighted') => { const e = { id:uid('e'), name, kind, archived:false }; D.exercises.push(e); return e; };
  const bench = ex('Bench press'), row = ex('Barbell row'), ohp = ex('Overhead press'), pull = ex('Pull-up', 'bodyweight'),
    squat = ex('Back squat'), rdl = ex('Romanian deadlift'), lp = ex('Leg press');
  const it = (e, sets, a, b, w, rest) => ({ id:uid('ti'), exId:e.id, sets, repMin:a, repMax:b, weight:w, rest, notes:'' });
  const upA = { id:uid('tp'), name:'Upper A', items:[it(bench, 3, 6, 8, 60, 120), it(row, 3, 8, 10, 50, 90), it(ohp, 3, 8, 10, 35, 90), it(pull, 3, 5, 8, null, 90)] };

  D.collections.push({ id:uid('c'), name:'Upper / Lower', templates:[upA, loA] });
  const today = todayKey();
  let k = 0;
  for (let back = 30; back >= 2; back -= (rnd() < 0.5 ? 3 : 4)){
    const tpl = k % 2 ? loA : upA, date = addDays(today, -back);
    const start = fromKey(date); start.setHours(7, 10, 0, 0);
    const s = { id:uid('ws'), status:'done', date, startTs:start.getTime(), endTs:start.getTime() + (50 + Math.round(rnd() * 20)) * 60000,
      templateId:tpl.id, name:tpl.name, collection:'Upper / Lower', exercises:[] };
    const prog = Math.floor(k / 2);
    for (const i of tpl.items){
      const e = D.exercises.find(x => x.id === i.exId);
      const w = i.weight == null ? null : i.weight + Math.floor(prog / 2) * 2.5;
      const sets = [];
      for (let j = 0; j < i.sets; j++) sets.push({ w, r: Math.max(1, (i.repMin || 6) + (prog % 2) + (j === i.sets - 1 && rnd() < 0.4 ? -1 : 0)), done:true });
      s.exercises.push({ exId:e.id, name:e.name, repMin:i.repMin, repMax:i.repMax, rest:i.rest, tplNotes:'', notes:'', sets });
    }
    D.sessions.push(s); k++;
  }
  for (let back = 27; back >= 1; back -= (rnd() < 0.5 ? 3 : 4)){
    const km = [4, 5, 5, 6.5, 8, 10][Math.floor(rnd() * 6)], pace = 330 + rnd() * 50 + (km > 7 ? 15 : 0) - (27 - back) * 0.8;
    D.runs.push({ id:uid('r'), date:addDays(today, -back), distM:km * 1000, durS:Math.round(km * pace), effort:1 + Math.floor(rnd() * 4), notes:'', ts:Date.now() - back * 864e5 });
  }
  const food = (name, refAmt, refUnit, kcal, p, c, f, extra) => { const x = { id:uid('f'), name, brand:'', refAmt, refUnit, servingLabel:'', kcal, p, c, f, fav:false, lastUsed:null, lastAmt:null, ...extra }; D.foods.push(x); return x; };
  const oats = food('Rolled oats', 100, 'g', 389, 16.9, 66, 6.9, { fav:true }), milk = food('Milk, toned', 100, 'ml', 58, 3.1, 4.7, 3),
    whey = food('Whey protein', 1, 'serving', 120, 24, 3, 1.5, { servingLabel:'1 scoop', brand:'Sample brand', fav:true }), chicken = food('Chicken breast, cooked', 100, 'g', 165, 31, 0, 3.6),
    rice = food('Rice, cooked', 100, 'g', 130, 2.7, 28, 0.3), dal = food('Dal, cooked', 100, 'g', 116, 9, 20, 0.4), banana = food('Banana', 1, 'serving', 105, 1.3, 27, 0.4, { servingLabel:'1 medium' }),
    eggs = food('Egg', 1, 'serving', 72, 6.3, 0.4, 4.8, { servingLabel:'1 large' });
  const plan = [['breakfast', oats, 60], ['breakfast', milk, 250], ['snacks', whey, 1], ['lunch', rice, 200], ['lunch', dal, 180], ['dinner', chicken, 150], ['dinner', rice, 150], ['snacks', banana, 1], ['breakfast', eggs, 2]];
  for (let back = 13; back >= 0; back--){
    if ([3, 7, 10].includes(back)) continue;
    const date = addDays(today, -back);
    for (const [meal, f, amt] of plan){

      if (rnd() < 0.15) continue;
      const a = amt * (0.8 + rnd() * 0.4), am = f.refUnit === 'serving' ? Math.max(0.5, Math.round(a * 2) / 2) : Math.round(a / 5) * 5;

      f.lastUsed = Date.now() - back * 864e5; f.lastAmt = am;
    }

  const read = hab('Read', '📖', HABIT_COLORS[1], 'build', 'check', null, null, null);
  const stretch = hab('Stretch', '🧘', HABIT_COLORS[0], 'build', 'duration', [1, 3, 5], 10, null);
  const scroll = hab('Late-night scrolling', '📱', HABIT_COLORS[3], 'reduce', 'count', null, null, 1);

    if ([1, 3, 5].includes(dow(d)) && rnd() < 0.8) D.habitLogs[stretch.id][d] = { v: rnd() < 0.85 ? 10 : 5, note:'' };
    if (rnd() < 0.75){ const v = rnd() < 0.55 ? 0 : 1 + Math.floor(rnd() * 3); D.habitLogs[scroll.id][d] = { v, note: v > 1 && rnd() < 0.5 ? 'Stressful day' : '' }; }
  }
  return D;
}

async function loadMode(mode){
  await flush();
  Store.close();
  MODE = mode;
  try { localStorage.setItem('steady-mode', mode); } catch (e) {}
  storageErr = null;
  let data = null;
  try { await Store.open(mode === 'demo' ? DB_DEMO : DB_REAL); data = await Store.readAll(); }
  catch (e) { Store.close(); storageErr = 'Storage is unavailable in this browser, so changes will be lost when the page closes. Export a backup to keep them.'; }
  S = normalize(data && Object.keys(data).length ? data : null);
  if (mode === 'demo' && !S.settings.onboarded){
    S = demoData();
    if (Store.db) try { await Store.write(Object.fromEntries(KEYS.map(k => [k, S[k]])), true); } catch (e) {}
  }
  UI.date = todayKey(); UI.progEx = null; UI.histN = 8;
  applyTheme(); render();
}
